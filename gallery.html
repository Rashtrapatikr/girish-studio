<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - Girish Studio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- AOS Animation CSS -->
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>
<body>

  <header>
    <div class="container nav-container">
      <a href="index.html" class="logo">Girish<span>Studio</span></a>
      <div class="mobile-menu-btn" id="mobile-btn"><i class="fas fa-bars"></i></div>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="gallery.html" class="active">Gallery</a></li>
        <li><a href="booking.html">Book Now</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </header>

  <section class="inner-header">
    <div class="container">
      <h1 data-aos="fade-down">Our Portfolio</h1>
    </div>
  </section>

  <section class="padding-y">
    <div class="container">
      <div class="gallery-grid" data-aos="fade-up" data-aos-delay="200">
        <div class="gallery-item">
          <img src="images/wedding_shoot.png" alt="Wedding Photography">
          <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
        </div>
        <div class="gallery-item">
          <img src="images/drone_shoot.png" alt="Drone Shoot">
          <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
        </div>
        <div class="gallery-item">
  <section class="gallery">
    <div class="container">
      <div class="gallery-grid" data-aos="fade-up" data-aos-delay="200" id="public-gallery-grid">
        <div style="grid-column: 1 / -1; text-align: center; padding: 50px;">
          <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary-color);"></i>
          <p style="margin-top: 15px;">Loading amazing shots...</p>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 Girish Studio. All Rights Reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/gallery');
        const items = await res.json();
        const grid = document.getElementById('public-gallery-grid');
        
        if (res.ok) {
          if (items.length === 0) {
            grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">Check back later for our new portfolio!</div>';
          } else {
            grid.innerHTML = '';
            items.forEach(item => {
              const mediaHtml = item.type === 'video' 
                ? `<video src="${item.filename}" style="width: 100%; height: 100%; object-fit: cover; cursor: pointer;" onclick="openLightbox('${item.filename}', 'video')"></video>`
                : `<img src="${item.filename}" alt="${item.title}" style="width: 100%; height: 100%; object-fit: cover; transition: transform var(--transition-speed); cursor: pointer;" onclick="openLightbox('${item.filename}', 'image')">`;
                
              grid.innerHTML += `
                <div class="gallery-item" style="position: relative; overflow: hidden; border-radius: 8px; height: 300px;">
                  ${mediaHtml}
                  <div class="overlay" style="position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.8)); padding: 20px; color: white; opacity: 0; transition: opacity var(--transition-speed); pointer-events: none;">
                    <h3 style="margin: 0;">${item.title}</h3>
                  </div>
                </div>
              `;
            });

            // Add hover effect for overlay
            document.querySelectorAll('.gallery-item').forEach(el => {
              el.addEventListener('mouseenter', () => {
                const overlay = el.querySelector('.overlay');
                if(overlay) overlay.style.opacity = '1';
                const img = el.querySelector('img');
                if(img) img.style.transform = 'scale(1.05)';
              });
              el.addEventListener('mouseleave', () => {
                const overlay = el.querySelector('.overlay');
                if(overlay) overlay.style.opacity = '0';
                const img = el.querySelector('img');
                if(img) img.style.transform = 'scale(1)';
              });
            });
          }
        }
      } catch (err) {
        console.error(err);
      }
    });

    // Lightbox Functions
    function openLightbox(src, type) {
      const modal = document.getElementById('lightbox-modal');
      const img = document.getElementById('lightbox-img');
      const video = document.getElementById('lightbox-video');
      
      if (type === 'image') {
        img.src = src;
        img.style.display = 'block';
        video.style.display = 'none';
        video.pause();
      } else {
        video.src = src;
        video.style.display = 'block';
        img.style.display = 'none';
        video.play();
      }
      
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      const modal = document.getElementById('lightbox-modal');
      const video = document.getElementById('lightbox-video');
      modal.style.display = 'none';
      video.pause();
      document.body.style.overflow = 'auto';
    }
  </script>

  <!-- Lightbox Modal -->
  <div id="lightbox-modal" class="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <img id="lightbox-img" style="display:none;">
      <video id="lightbox-video" controls style="display:none;"></video>
    </div>
  </div>

  <!-- AOS Animation Script -->
  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 800, once: true, offset: 100 });
  </script>
</body>
</html>
